<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#063a35" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Календарь перевозок</title>
  <style>
    :root{
      --bg1:#063e39;--bg2:#03171a;--card:rgba(6,42,42,.68);--card2:rgba(9,49,48,.72);
      --text:#f8faf9;--muted:rgba(248,250,249,.58);--line:rgba(255,255,255,.22);--line2:rgba(255,255,255,.34);
      --green:#31d17c;--green2:#6ee7a1;--red:#ff4b45;--shadow:0 18px 60px rgba(0,0,0,.32);
      --cell:rgba(255,255,255,.035);--input:rgba(255,255,255,.08);
    }
    body.light{
      --bg1:#eef3f2;--bg2:#dfe8e6;--card:rgba(255,255,255,.78);--card2:rgba(255,255,255,.88);
      --text:#101718;--muted:rgba(16,23,24,.58);--line:rgba(0,0,0,.18);--line2:rgba(0,0,0,.32);
      --green:#26bf70;--green2:#62d895;--red:#ef3d36;--shadow:0 14px 34px rgba(12,30,32,.12);
      --cell:rgba(255,255,255,.52);--input:rgba(255,255,255,.75);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 50% 0%,var(--bg1),var(--bg2) 72%);color:var(--text)}
    body{padding:calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 18px);overflow-x:hidden}
    .app{width:100%;max-width:430px;margin:0 auto;min-height:100dvh;position:relative;overflow:hidden}
    header{display:flex;align-items:center;gap:9px;margin:42px 2px 16px}
    h1{font-size:26px;line-height:1.04;margin:0;font-weight:900;letter-spacing:-.8px;flex:1;text-shadow:0 2px 10px rgba(0,0,0,.2)}
    .iconBtn{width:45px;height:45px;border-radius:15px;border:1.6px solid var(--line2);background:var(--card);color:var(--text);display:grid;place-items:center;font-size:25px;font-weight:800;box-shadow:var(--shadow)}
    .themeBtn{font-size:22px}.shareBtn{font-size:23px}
    .calendarCard{width:100%;border:1.8px solid var(--line2);border-radius:24px;background:linear-gradient(180deg,var(--card),rgba(5,34,35,.42));padding:16px 12px 18px;box-shadow:var(--shadow);overflow:hidden;touch-action:pan-y}
    body.light .calendarCard{background:var(--card2)}
    .monthTop{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;margin:0 2px 13px}
    .navBtn{height:48px;border-radius:16px;border:1.6px solid var(--line);background:rgba(255,255,255,.065);color:var(--text);font-size:32px;font-weight:700;line-height:1;display:grid;place-items:center}
    body.light .navBtn{background:rgba(255,255,255,.65)}
    .monthTitle{text-align:center;font-size:27px;font-weight:900;letter-spacing:-.5px}
    .week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
    .week{margin-bottom:8px}.week div{text-align:center;color:var(--muted);font-size:16px;font-weight:900;min-width:0}.week div.sat{color:var(--red)}
    .grid{transition:transform .22s ease,opacity .22s ease}.grid.slideL{transform:translateX(-18px);opacity:.45}.grid.slideR{transform:translateX(18px);opacity:.45}
    .day{width:100%;min-width:0;height:42px;border-radius:13px;border:2px solid var(--line);background:var(--cell);color:var(--text);font-size:21px;font-weight:900;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:inset 0 0 0 .4px rgba(255,255,255,.04)}
    body.light .day{background:rgba(255,255,255,.55);border-color:rgba(0,0,0,.2)}
    .day.sat{color:var(--red)}
    .day.empty{visibility:hidden}.day.selected{border-color:var(--green2);box-shadow:0 0 0 2px rgba(49,209,124,.16)}
    .day.closed{background:linear-gradient(145deg,var(--green2),var(--green));color:#062019;border-color:rgba(255,255,255,.22)}
    .day.closed.sat{color:#062019}.day.today::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:#fff}.light .day.today::after{background:#000}.day.closed.today::after{display:none}
    .summary{display:flex;justify-content:space-between;align-items:center;margin:16px 3px 8px;color:var(--muted);font-weight:900;font-size:16px}.sum{color:var(--green2);font-size:18px}
    .orders{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto;padding-bottom:92px;scrollbar-width:none}.orders::-webkit-scrollbar{display:none}
    .emptyBox{display:none}
    .order{border:1.8px solid var(--line2);background:linear-gradient(180deg,var(--card2),rgba(255,255,255,.02));border-radius:17px;padding:10px 10px;display:grid;grid-template-columns:48px minmax(0,1fr) auto 36px 36px;gap:7px;align-items:center;box-shadow:0 10px 24px rgba(0,0,0,.11)}
    body.light .order{background:rgba(255,255,255,.78)}
    .time{font-size:14px;font-weight:900;color:var(--muted)}.route{font-size:16px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-size:15px;font-weight:950;color:var(--green2);white-space:nowrap}.mini{width:34px;height:34px;border-radius:50%;border:0;color:white;display:grid;place-items:center;padding:0}.mini svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.edit{background:linear-gradient(145deg,#1db461,#3ad381)}.del{background:linear-gradient(145deg,#d9302c,#ff514b)}
    .addRow{position:fixed;left:calc(50% - 215px + 18px);bottom:calc(env(safe-area-inset-bottom) + 44px);display:flex;align-items:center;gap:12px;z-index:5;color:var(--green2);font-weight:950;font-size:16px;background:transparent;border:0;padding:0;text-shadow:0 2px 12px rgba(0,0,0,.24)}.addCircle{width:54px;height:54px;border-radius:50%;border:1.6px solid rgba(255,255,255,.28);background:radial-gradient(circle at 32% 25%,#88f0b4,var(--green) 72%);color:#fff;font-size:38px;line-height:1;display:grid;place-items:center;box-shadow:0 18px 38px rgba(0,0,0,.30),0 0 0 4px rgba(49,209,124,.08)}
    @media(max-width:430px){.addRow{left:16px}.day{height:42px;font-size:21px}.week,.grid{gap:7px}h1{font-size:26px}}
@media(max-width:380px){body{padding-left:10px;padding-right:10px}.calendarCard{padding-left:9px;padding-right:9px}.week,.grid{gap:6px}.day{height:39px;font-size:20px}.monthTitle{font-size:24px}.navBtn{height:44px}.monthTop{grid-template-columns:44px 1fr 44px}}
    .sheet{position:fixed;inset:0;background:rgba(0,0,0,.48);display:none;align-items:end;z-index:20;overflow:hidden}.sheet.show{display:flex}.modal{width:100%;max-width:430px;margin:0 auto;background:#071c22;color:var(--text);border:1.5px solid var(--line2);border-radius:24px 24px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px);box-shadow:0 -18px 50px rgba(0,0,0,.36);overflow:hidden}body.light .modal{background:#f4f7f6;color:#101718}.modalHead{display:flex;align-items:center;margin-bottom:8px}.modal h2{margin:0;flex:1;font-size:22px;line-height:1}.close{width:40px;height:40px;border-radius:14px;border:0;background:rgba(255,255,255,.1);color:var(--text);font-size:30px}.form{display:grid;gap:8px}.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.field label{display:block;color:var(--muted);font-size:12px;font-weight:900;margin:0 0 4px}.field input{width:100%;min-width:0;height:42px;border-radius:13px;border:1.7px solid var(--line2);background:var(--input);color:var(--text);font-size:16px;font-weight:850;padding:0 10px;outline:none}.save{height:50px;border:0;border-radius:17px;background:linear-gradient(145deg,var(--green2),var(--green));font-size:20px;font-weight:950;color:#062019;margin-top:2px}.hint{display:none}
  </style>
</head>
<body>
  <div class="app">
    <header><h1>Календарь перевозок</h1><button class="iconBtn themeBtn" id="themeBtn">☾</button><button class="iconBtn shareBtn" id="shareBtn">↗</button></header>
    <section class="calendarCard" id="swipeArea"><div class="monthTop"><button class="navBtn" id="prev">‹</button><div class="monthTitle" id="monthTitle"></div><button class="navBtn" id="next">›</button></div><div class="week" id="week"></div><div class="grid" id="grid"></div></section>
    <div class="summary"><span id="selectedLabel"></span><span class="sum" id="dayTotal"></span></div>
    <div class="orders" id="orders"></div>
    <button class="addRow" id="addBtn"><span class="addCircle">+</span><span>Добавить заказ</span></button>
  </div>
  <div class="sheet" id="sheet"><div class="modal"><div class="modalHead"><h2 id="modalTitle">Добавить заказ</h2><button class="close" id="close">×</button></div><form class="form" id="form"><div class="row2"><div class="field"><label>Откуда</label><input id="from" list="cities" placeholder="Хайфа"></div><div class="field"><label>Куда</label><input id="to" list="cities" placeholder="Тель-Авив"></div></div><div class="row2"><div class="field"><label>Время</label><input id="time" type="time"></div><div class="field"><label>Цена ₪</label><input id="price" type="number" inputmode="numeric" placeholder="900"></div></div><button class="save" type="submit">Сохранить</button></form></div></div>
  <datalist id="cities"></datalist>
<script>
const VERSION='v8.0-compact-form';
const months=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const week=['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'];
const cities=['Хайфа','Тель-Авив','Иерусалим','Беэр-Шева','Акко','Тверия','Нагария','Кирьят-Ата','Кирьят-Бялик','Кирьят-Моцкин','Кирьят-Ям','Нешер','Тират-Кармель','Афула','Ноф-ха-Галиль','Назарет','Кармиэль','Цфат','Рош-Пина','Кацрин','Хадера','Нетания','Герцлия','Рамат-Ган','Гиватаим','Бат-Ям','Холон','Ришон-ле-Цион','Реховот','Нес-Циона','Ашдод','Ашкелон','Кирьят-Гат','Сдерот','Эйлат','Петах-Тиква','Кфар-Саба','Раанана','Ход-ха-Шарон','Рамат-ха-Шарон','Модиин','Лод','Рамла','Йокнеам','Зихрон-Яаков','Пардес-Хана','Ор-Акива','Кейсария','Маалот-Таршиха','Шломи','Кирьят-Шмона','Метулла','Далият-эль-Кармель','Осфия','Сахнин','Шфарам','Тамра','Умм-эль-Фахм','Арад','Димона','Нетивот','Офаким','Мицпе-Рамон','Явне','Ган-Явне','Кфар-Йона','Биньямина','Гиват-Ада','Кибуц Ягур','Кибуц Лохамей-ха-Гетаот','Кибуц Эйн-Гев','Кибуц Дгания','Кибуц Мааган-Михаэль','Кибуц Нахшолим','Кибуц Бейт-Альфа'];
cities.forEach(c=>{let o=document.createElement('option');o.value=c;document.getElementById('cities').appendChild(o)});
let today=new Date();let view=new Date(today.getFullYear(),today.getMonth(),1);let selected=new Date(today.getFullYear(),today.getMonth(),today.getDate());let editId=null;
const $=id=>document.getElementById(id);const key='cargoDiaryOrdersV6';
let orders=JSON.parse(localStorage.getItem(key)||'[]');
function save(){localStorage.setItem(key,JSON.stringify(orders))}function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function money(n){return '₪'+Number(n||0).toLocaleString('ru-RU')}function dayName(d){return ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'][d.getDay()]}
function render(){renderWeek();renderCal();renderOrders();$('themeBtn').textContent=document.body.classList.contains('light')?'☀':'☾'}
function renderWeek(){ $('week').innerHTML=week.map((w,i)=>`<div class="${i==6?'sat':''}">${w}</div>`).join('') }
function renderCal(){ $('monthTitle').textContent=months[view.getMonth()]+' '+view.getFullYear(); const grid=$('grid'); grid.innerHTML=''; let first=new Date(view.getFullYear(),view.getMonth(),1).getDay(); let days=new Date(view.getFullYear(),view.getMonth()+1,0).getDate(); for(let i=0;i<first;i++){let e=document.createElement('button');e.className='day empty';grid.appendChild(e)} for(let d=1;d<=days;d++){let date=new Date(view.getFullYear(),view.getMonth(),d);let k=ymd(date);let has=orders.some(o=>o.date===k);let el=document.createElement('button');el.className='day'+(date.getDay()==6?' sat':'')+(ymd(date)===ymd(selected)?' selected':'')+(has?' closed':'')+(ymd(date)===ymd(today)?' today':'');el.textContent=d;el.onclick=()=>{selected=date;render()};grid.appendChild(el)}}
function renderOrders(){let k=ymd(selected);let list=orders.filter(o=>o.date===k).sort((a,b)=>(a.time||'').localeCompare(b.time||''));$('selectedLabel').textContent=selected.getDate()+' '+months[selected.getMonth()].toLowerCase()+' • '+dayName(selected);$('dayTotal').textContent=list.length?money(list.reduce((s,o)=>s+Number(o.price||0),0)):''; if(!list.length){$('orders').innerHTML='';return} $('orders').innerHTML=list.map(o=>`<div class="order"><div class="time">${o.time||'--:--'}</div><div class="route">${esc(o.from)} → ${esc(o.to)}</div><div class="price">${money(o.price)}</div><button class="mini edit" aria-label="Изменить" onclick="editOrder('${o.id}')"><svg viewBox="0 0 24 24"><path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M14 7l3 3"/></svg></button><button class="mini del" aria-label="Удалить" onclick="delOrder('${o.id}')"><svg viewBox="0 0 24 24"><path d="M6 7h12"/><path d="M9 7V5h6v2"/><path d="M8 10v9h8v-9"/><path d="M10 12v5M14 12v5"/></svg></button></div>`).join('')}
function esc(s){return String(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function changeMonth(n){const grid=$('grid');grid.classList.add(n>0?'slideL':'slideR');setTimeout(()=>{view=new Date(view.getFullYear(),view.getMonth()+n,1);selected=new Date(view.getFullYear(),view.getMonth(),1);grid.classList.remove('slideL','slideR');render()},180)}
$('prev').onclick=()=>changeMonth(-1);$('next').onclick=()=>changeMonth(1);$('addBtn').onclick=()=>openForm();$('close').onclick=()=>closeForm();$('sheet').onclick=e=>{if(e.target.id==='sheet')closeForm()};
function openForm(o=null){editId=o?.id||null;$('modalTitle').textContent=editId?'Изменить заказ':'Добавить заказ';$('time').value=o?.time||'';$('from').value=o?.from||'';$('to').value=o?.to||'';$('price').value=o?.price||'';$('sheet').classList.add('show');setTimeout(()=>$('time').focus(),100)}function closeForm(){$('sheet').classList.remove('show')}
$('form').onsubmit=e=>{e.preventDefault();let obj={id:editId||String(Date.now()),date:ymd(selected),time:$('time').value,from:$('from').value.trim(),to:$('to').value.trim(),price:$('price').value}; if(!obj.from&&!obj.to&&!obj.price)return; if(editId){orders=orders.map(o=>o.id===editId?obj:o)}else orders.push(obj);save();closeForm();render()}
window.editOrder=id=>openForm(orders.find(o=>o.id===id));window.delOrder=id=>{if(confirm('Удалить заказ?')){orders=orders.filter(o=>o.id!==id);save();render()}}
$('themeBtn').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem('cargoTheme',document.body.classList.contains('light')?'light':'dark');render()}; if(localStorage.getItem('cargoTheme')==='light')document.body.classList.add('light');
$('shareBtn').onclick=async()=>{let url=location.origin+location.pathname; if(navigator.share){try{await navigator.share({title:'Календарь перевозок',text:'Календарь перевозок',url})}catch(e){}}else{prompt('Ссылка:',url)}};
let sx=0,sy=0;$('swipeArea').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});$('swipeArea').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4)changeMonth(dx<0?1:-1)},{passive:true});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js?v=8').catch(()=>{})}
render();
</script>
</body></html>

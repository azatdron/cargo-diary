<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f8fb" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" />
  <title>Дневник перевозок</title>
  <style>
    :root{
      --bg:#f4f7fb;--card:#ffffff;--text:#172033;--muted:#7b879a;--line:#e4e9f1;--green:#1ec773;--green2:#dff8eb;--blue:#2563eb;--danger:#ef4444;--shadow:0 14px 38px rgba(23,32,51,.12);--radius:22px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:env(safe-area-inset-top) 14px calc(18px + env(safe-area-inset-bottom));}
    .app{max-width:520px;margin:0 auto;padding-top:16px}
    .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:4px 0 18px}
    h1{font-size:30px;line-height:1.05;margin:0 0 5px;font-weight:900;letter-spacing:-.7px}.sub{color:var(--muted);font-weight:650;font-size:15px}.backup{border:0;background:#eef3fa;color:#445069;border-radius:18px;padding:13px 17px;font-size:16px;font-weight:850;box-shadow:inset 0 0 0 1px var(--line)}
    .monthCard{background:var(--card);border-radius:28px;padding:18px 14px 16px;box-shadow:var(--shadow);border:1px solid var(--line)}
    .monthHead{display:grid;grid-template-columns:54px 1fr 54px;align-items:center;gap:8px;margin-bottom:16px}.nav{height:52px;border:0;border-radius:17px;background:#eef3fa;color:#24324b;font-size:34px;font-weight:900;display:flex;align-items:center;justify-content:center}.monthTitle{text-align:center;font-size:27px;font-weight:950;letter-spacing:-.4px}.weekdays,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.weekdays{margin-bottom:8px}.weekdays div{text-align:center;color:#8a96aa;font-size:14px;font-weight:900}.day{height:54px;border-radius:16px;background:#f8fafd;border:1px solid #e1e7f0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:22px;font-weight:900;color:#1f2937;position:relative}.day.other{opacity:.25}.day.today{border-color:#21c878;background:var(--green2);color:#076b3c}.day.selected{outline:3px solid rgba(37,99,235,.22);border-color:var(--blue)}.dot{width:6px;height:6px;border-radius:50%;background:var(--blue)}.sumRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.sum{background:#f7fafc;border:1px solid var(--line);border-radius:18px;padding:12px}.sum span{display:block;color:var(--muted);font-size:13px;font-weight:750}.sum b{display:block;font-size:23px;margin-top:4px}.hint{margin:15px 4px 0;color:#79859a;font-size:14px;line-height:1.35;font-weight:650}.todayBtn{width:100%;border:0;background:var(--green);color:#072716;border-radius:19px;padding:15px;margin-top:14px;font-size:18px;font-weight:950}
    .modalBackdrop{position:fixed;inset:0;background:rgba(15,23,42,.32);backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:12px}.modalBackdrop.show{display:flex}.sheet{width:min(520px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:28px 28px 22px 22px;box-shadow:0 22px 60px rgba(0,0,0,.25);padding:18px 16px calc(18px + env(safe-area-inset-bottom))}.sheetTop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.sheetTitle{font-size:24px;font-weight:950;letter-spacing:-.3px}.close{width:46px;height:46px;border-radius:16px;border:0;background:#f1f5f9;font-size:28px;color:#475569}.dayTotal{background:#f0fdf4;border:1px solid #bbf7d0;color:#14532d;border-radius:17px;padding:11px 14px;font-weight:900;margin-bottom:12px}.orders{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}.empty{border:1px dashed #cbd5e1;border-radius:18px;padding:28px 14px;text-align:center;color:#8090a5;font-size:16px;font-weight:750}.order{background:#f8fafc;border:1px solid #e2e8f0;border-radius:19px;padding:13px}.orderMain{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.route{font-size:18px;font-weight:950;line-height:1.25}.price{font-size:19px;font-weight:950;color:#07834c;white-space:nowrap}.time{color:#64748b;font-weight:900;margin-top:4px}.orderActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.smallBtn{border:0;border-radius:14px;padding:12px;font-size:15px;font-weight:900}.edit{background:#eaf2ff;color:#1e40af}.del{background:#fee2e2;color:#991b1b}.addBtn{width:100%;border:0;background:linear-gradient(135deg,#22c55e,#16a34a);color:#061b0d;border-radius:18px;padding:16px;font-size:19px;font-weight:950}.form{display:none;margin-top:14px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:20px;padding:14px}.form.show{display:block}.field{margin-bottom:11px}label{display:block;font-weight:850;color:#475569;margin:0 0 6px 2px}input{width:100%;border:1px solid #d6dee9;background:white;border-radius:15px;padding:14px 13px;font-size:18px;font-weight:800;color:#111827}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{width:100%;border:0;background:#2563eb;color:white;border-radius:16px;padding:15px;font-size:18px;font-weight:950;margin-top:4px}.cancel{width:100%;border:0;background:#e2e8f0;color:#334155;border-radius:16px;padding:14px;font-size:17px;font-weight:900;margin-top:9px}.fileInput{display:none}
  </style>
</head>
<body>
<div class="app">
  <div class="top"><div><h1>Дневник перевозок</h1><div class="sub">Календарь заказов: откуда → куда, время и цена</div></div><button class="backup" id="backupBtn">Бэкап</button></div>
  <section class="monthCard">
    <div class="monthHead"><button class="nav" id="prevMonth">‹</button><div class="monthTitle" id="monthTitle"></div><button class="nav" id="nextMonth">›</button></div>
    <div class="weekdays"><div>ПН</div><div>ВТ</div><div>СР</div><div>ЧТ</div><div>ПТ</div><div>СБ</div><div>ВС</div></div>
    <div class="grid" id="calendarGrid"></div>
    <div class="sumRow"><div class="sum"><span>За месяц</span><b id="monthSum">₪0</b></div><div class="sum"><span>Заказов</span><b id="monthCount">0</b></div></div>
    <button class="todayBtn" id="todayBtn">Сегодня</button>
    <div class="hint">Нажми на дату — откроется список заказов за этот день. Точка под числом означает, что в этот день уже есть заказ.</div>
  </section>
</div>

<div class="modalBackdrop" id="dayModal">
  <div class="sheet">
    <div class="sheetTop"><div><div class="sheetTitle" id="sheetTitle"></div><div class="sub" id="sheetSub"></div></div><button class="close" id="closeSheet">×</button></div>
    <div class="dayTotal" id="dayTotal">Итого: ₪0</div>
    <div class="orders" id="ordersList"></div>
    <button class="addBtn" id="showFormBtn">+ Добавить заказ</button>
    <form class="form" id="orderForm">
      <div class="formGrid"><div class="field"><label>Время</label><input id="time" type="time"></div><div class="field"><label>Цена ₪</label><input id="price" type="number" inputmode="numeric" placeholder="900"></div></div>
      <div class="field"><label>Откуда</label><input id="from" placeholder="Хайфа"></div>
      <div class="field"><label>Куда</label><input id="to" placeholder="Тель-Авив"></div>
      <button class="save" type="submit">Сохранить</button><button class="cancel" type="button" id="cancelForm">Отмена</button>
    </form>
  </div>
</div>
<input class="fileInput" id="restoreInput" type="file" accept="application/json">
<script>
const KEY='transportDiary.month.v2';
let data=JSON.parse(localStorage.getItem(KEY)||'{}');
let current=new Date(); current.setDate(1);
let selected=new Date();
let editingId=null;
const months=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const wdays=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const money=n=>'₪'+(Number(n)||0).toLocaleString('ru-RU');
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function render(){
  document.getElementById('monthTitle').textContent=`${months[current.getMonth()]} ${current.getFullYear()}`;
  const grid=document.getElementById('calendarGrid'); grid.innerHTML='';
  const y=current.getFullYear(), m=current.getMonth();
  const first=new Date(y,m,1); const start=(first.getDay()+6)%7;
  const days=new Date(y,m+1,0).getDate(); const prevDays=new Date(y,m,0).getDate();
  let total=0,count=0;
  Object.keys(data).forEach(k=>{const [yy,mm]=k.split('-').map(Number); if(yy===y&&mm===m+1){data[k].forEach(o=>{total+=Number(o.price)||0;count++;});}});
  document.getElementById('monthSum').textContent=money(total); document.getElementById('monthCount').textContent=count;
  const todayKey=key(new Date());
  for(let i=0;i<42;i++){
    const cell=document.createElement('button'); cell.className='day';
    let dnum, real=new Date(y,m,1);
    if(i<start){dnum=prevDays-start+i+1; real=new Date(y,m-1,dnum); cell.classList.add('other');}
    else if(i>=start+days){dnum=i-start-days+1; real=new Date(y,m+1,dnum); cell.classList.add('other');}
    else{dnum=i-start+1; real=new Date(y,m,dnum);}
    const k=key(real); if(k===todayKey)cell.classList.add('today');
    cell.innerHTML=`<span>${dnum}</span>${(data[k]&&data[k].length)?'<i class="dot"></i>':''}`;
    cell.onclick=()=>openDay(real); grid.appendChild(cell);
  }
}
function openDay(d){selected=new Date(d); editingId=null; document.getElementById('dayModal').classList.add('show'); hideForm(); renderDay();}
function closeDay(){document.getElementById('dayModal').classList.remove('show'); render();}
function renderDay(){
  const k=key(selected), arr=(data[k]||[]).slice().sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  document.getElementById('sheetTitle').textContent=`${selected.getDate()} ${months[selected.getMonth()].toLowerCase()} ${selected.getFullYear()}`;
  document.getElementById('sheetSub').textContent=wdays[selected.getDay()];
  const sum=arr.reduce((s,o)=>s+(Number(o.price)||0),0); document.getElementById('dayTotal').textContent=`Итого за день: ${money(sum)} · заказов: ${arr.length}`;
  const list=document.getElementById('ordersList'); list.innerHTML='';
  if(!arr.length){list.innerHTML='<div class="empty">Заказов на этот день пока нет.</div>';return;}
  arr.forEach(o=>{const el=document.createElement('div');el.className='order';el.innerHTML=`<div class="orderMain"><div><div class="route">${esc(o.from)} → ${esc(o.to)}</div><div class="time">${o.time||'Без времени'}</div></div><div class="price">${money(o.price)}</div></div><div class="orderActions"><button class="smallBtn edit">Изменить</button><button class="smallBtn del">Удалить</button></div>`;el.querySelector('.edit').onclick=()=>editOrder(o.id);el.querySelector('.del').onclick=()=>deleteOrder(o.id);list.appendChild(el);});
}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function showForm(){document.getElementById('orderForm').classList.add('show');document.getElementById('showFormBtn').style.display='none';setTimeout(()=>document.getElementById('time').focus(),100)}
function hideForm(){document.getElementById('orderForm').classList.remove('show');document.getElementById('showFormBtn').style.display='block';editingId=null;['time','from','to','price'].forEach(id=>document.getElementById(id).value='');}
function editOrder(id){const o=(data[key(selected)]||[]).find(x=>x.id===id); if(!o)return; editingId=id; document.getElementById('time').value=o.time||'';document.getElementById('from').value=o.from||'';document.getElementById('to').value=o.to||'';document.getElementById('price').value=o.price||'';showForm();}
function deleteOrder(id){if(!confirm('Удалить заказ?'))return;const k=key(selected);data[k]=(data[k]||[]).filter(o=>o.id!==id);if(!data[k].length)delete data[k];save();renderDay();render();}
document.getElementById('orderForm').onsubmit=e=>{e.preventDefault();const k=key(selected);const o={id:editingId||Date.now().toString(36),time:time.value,from:from.value.trim()||'Откуда',to:to.value.trim()||'Куда',price:Number(price.value)||0};data[k]=data[k]||[];const i=data[k].findIndex(x=>x.id===o.id);if(i>=0)data[k][i]=o;else data[k].push(o);save();hideForm();renderDay();render();};
document.getElementById('prevMonth').onclick=()=>{current.setMonth(current.getMonth()-1);render();};
document.getElementById('nextMonth').onclick=()=>{current.setMonth(current.getMonth()+1);render();};
document.getElementById('todayBtn').onclick=()=>{current=new Date();current.setDate(1);render();openDay(new Date());};
document.getElementById('closeSheet').onclick=closeDay;document.getElementById('dayModal').onclick=e=>{if(e.target.id==='dayModal')closeDay();};
document.getElementById('showFormBtn').onclick=showForm;document.getElementById('cancelForm').onclick=hideForm;
document.getElementById('backupBtn').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='transport-diary-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);};
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}render();
</script>
</body>
</html>

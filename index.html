  <style>

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 50% 0%,var(--bg1),var(--bg2) 72%);color:var(--text)}body{padding:calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 18px);overflow-x:hidden}.app{width:100%;max-width:430px;margin:0 auto;min-height:100dvh;position:relative;overflow:hidden}

    .calendarCard{width:100%;border:1.8px solid var(--line2);border-radius:24px;background:linear-gradient(180deg,var(--card),rgba(5,34,35,.42));padding:16px 12px 18px;box-shadow:var(--shadow);overflow:hidden;touch-action:pan-y}body.light .calendarCard{background:var(--card2)}.monthTop{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;margin:0 2px 13px}.navBtn{height:48px;border-radius:16px;border:1.6px solid var(--line);background:rgba(255,255,255,.065);color:var(--text);font-size:32px;font-weight:700;line-height:1;display:grid;place-items:center}body.light .navBtn{background:rgba(255,255,255,.65)}.monthTitle{text-align:center;font-size:26px;font-weight:760;letter-spacing:-.5px}.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.week{margin-bottom:8px}.week div{text-align:center;color:var(--muted);font-size:16px;font-weight:850;min-width:0}.week div.sat{color:var(--red)}.grid{transition:transform .22s ease,opacity .22s ease}.grid.slideL{transform:translateX(-18px);opacity:.45}.grid.slideR{transform:translateX(18px);opacity:.45}.day{width:100%;min-width:0;height:42px;border-radius:13px;border:2px solid var(--line);background:var(--cell);color:var(--text);font-size:20px;font-weight:640;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:inset 0 0 0 .4px rgba(255,255,255,.05)}body.light .day{background:rgba(255,255,255,.58);border-color:rgba(0,0,0,.24)}.day.sat{color:var(--red)}.day.empty{visibility:hidden}.day.selected{border-color:var(--green2);box-shadow:0 0 0 2px rgba(49,209,124,.16)}.day.closed{background:linear-gradient(145deg,var(--green2),var(--green));color:#062019;border-color:rgba(255,255,255,.24)}.day.event{background:rgba(245,200,47,.14);color:var(--yellow2);border-color:var(--yellow)}.day.event.sat{color:var(--yellow2)}.day.closed.sat{color:#062019}.day.today::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:#fff}.light .day.today::after{background:#000}.day.closed.today::after{display:none}
    .summary{display:flex;justify-content:space-between;align-items:center;margin:16px 3px 8px;color:var(--muted);font-weight:850;font-size:16px}.sum{color:var(--green2);font-size:18px}.quickActions{display:flex;gap:10px;margin:4px 0 12px}.pillAdd{height:36px;border-radius:14px;border:1.5px solid var(--line2);background:rgba(255,255,255,.028);color:var(--text);display:flex;align-items:center;justify-content:center;gap:7px;padding:0 12px;font-size:14px;font-weight:760}.pillAdd .plus{width:20px;height:20px;border-radius:50%;border:1.3px solid rgba(255,255,255,.76);display:grid;place-items:center;font-size:17px;line-height:1;font-weight:520;color:#fff}.pillAdd.workAdd{border-color:var(--green2)}.pillAdd.workAdd .plus{border-color:var(--green2);color:var(--green2)}.pillAdd.eventAdd{border-color:var(--yellow)}.pillAdd.eventAdd .plus{border-color:var(--yellow);color:var(--yellow)}body.light .pillAdd{background:rgba(255,255,255,.62)}body.light .pillAdd .plus{border-color:#111;color:#111}.orders{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto;padding-bottom:20px;scrollbar-width:none}.orders::-webkit-scrollbar{display:none}.order{border:1.8px solid var(--line2);background:linear-gradient(180deg,var(--card2),rgba(255,255,255,.02));border-radius:17px;padding:10px 10px;display:grid;grid-template-columns:48px minmax(0,1fr) auto 36px 36px;gap:7px;align-items:center;box-shadow:0 10px 24px rgba(0,0,0,.11)}body.light .order{background:rgba(255,255,255,.78)}.time{font-size:14px;font-weight:800;color:var(--muted)}.route{font-size:16px;font-weight:820;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-size:15px;font-weight:870;color:var(--green2);white-space:nowrap}.eventTag{font-size:12px;font-weight:850;color:var(--muted);margin-inline-start:4px}.mini{width:34px;height:34px;border-radius:50%;border:0;color:white;display:grid;place-items:center;padding:0}.mini svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.edit{background:linear-gradient(145deg,#1db461,#3ad381)}.del{background:linear-gradient(145deg,#d9302c,#ff514b)}
    @media(max-width:430px){.day{height:42px;font-size:20px}.week,.grid{gap:7px}h1{font-size:25px}}@media(max-width:380px){body{padding-left:10px;padding-right:10px}.calendarCard{padding-left:9px;padding-right:9px}.week,.grid{gap:6px}.day{height:39px;font-size:19px}.monthTitle{font-size:24px}.navBtn{height:44px}.monthTop{grid-template-columns:44px 1fr 44px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}.field{min-width:0}.field input{width:100%}.field input{height:39px;font-size:15px}.modal h2{font-size:21px}.save{height:46px}.order{grid-template-columns:43px minmax(0,1fr) auto 33px 33px;gap:5px}.route{font-size:15px}.price{font-size:14px}}
    .sheet{position:fixed;inset:0;background:rgba(0,0,0,.48);display:none;align-items:end;z-index:20;overflow:hidden}.sheet.show{display:flex}.modal{width:100%;max-width:430px;margin:0 auto;background:#071c22;color:var(--text);border:1.5px solid var(--line2);border-radius:24px 24px 0 0;padding:13px 14px calc(env(safe-area-inset-bottom) + 14px);box-shadow:0 -18px 50px rgba(0,0,0,.36);overflow:hidden}body.light .modal{background:#f4f7f6;color:#101718}.modalHead{display:flex;align-items:center;margin-bottom:8px}.modal h2{margin:0;flex:1;font-size:21px;line-height:1;font-weight:820;letter-spacing:-.3px}.close{width:38px;height:38px;border-radius:13px;border:0;background:rgba(255,255,255,.10);color:var(--text);font-size:28px;line-height:1}.form{display:grid;gap:8px}.fields{display:grid;gap:8px}.row2{display:flex;gap:10px;align-items:end;width:100%;overflow:hidden}.field{min-width:0;flex:1 1 0;width:0}.field.wide{width:100%;flex:none}.field label{display:block;color:var(--muted);font-size:12px;font-weight:820;margin:0 0 5px}.field input{display:block;width:100%;max-width:100%;min-width:0;height:40px;border-radius:13px;border:1.7px solid var(--line2);background:var(--input);color:var(--text);font-size:15px;font-weight:660;padding:0 10px;outline:none}.save{height:46px;border:0;border-radius:16px;background:linear-gradient(145deg,var(--green2),var(--green));font-size:19px;font-weight:820;color:#062019;margin-top:4px}

    /* v14 fixed compact modal grid */
    .modal{padding:12px 14px calc(env(safe-area-inset-bottom) + 14px); max-height:88dvh;}
    .modal h2{font-size:20px;letter-spacing:-.35px;}
    .close{width:36px;height:36px;border-radius:13px;font-size:25px;}
    .form{gap:9px;}
    .fields{display:grid;gap:9px;width:100%;}
    .row2{display:grid !important;grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important;gap:10px !important;width:100% !important;overflow:visible !important;align-items:start !important;}
    .field{min-width:0 !important;width:100% !important;max-width:100% !important;flex:none !important;}
    .field.wide{grid-column:1/-1;}
    .field input{width:100% !important;max-width:100% !important;min-width:0 !important;height:38px !important;border-radius:13px;font-size:15px;padding:0 10px;appearance:none;-webkit-appearance:none;}
    .save{height:44px;border-radius:16px;font-size:18px;margin-top:5px;}
    @media(max-width:380px){.row2{gap:8px !important}.modal{padding-left:12px;padding-right:12px}.field input{height:37px !important;font-size:14px}.modal h2{font-size:19px}.save{height:43px}}
  

    /* v15 iPhone zoom + form overflow fix */
    html,body{width:100%;max-width:100%;overflow-x:hidden;touch-action:manipulation;}
    .app{width:100%;max-width:430px;overflow-x:hidden;}
    input,select,textarea,button{font-family:inherit;}
    input,select,textarea{font-size:16px !important;line-height:1.2;}
    .sheet{width:100vw;max-width:100vw;overflow-x:hidden;}
    .modal{width:100%;max-width:430px;overflow:hidden;}
    .modal h2{font-size:19px !important;}
    .fields{width:100%;max-width:100%;overflow:hidden;}
    .row2{display:grid !important;grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important;gap:10px !important;width:100% !important;max-width:100% !important;overflow:hidden !important;align-items:start !important;}
    .field{min-width:0 !important;width:100% !important;max-width:100% !important;overflow:hidden !important;}
    .field input{box-sizing:border-box !important;width:100% !important;max-width:100% !important;min-width:0 !important;height:40px !important;font-size:16px !important;padding:0 10px !important;}
    .save{height:44px !important;font-size:18px !important;}
    .order{max-width:100%;overflow:hidden;grid-template-columns:44px minmax(0,1fr) auto 34px 34px;}
    .route{min-width:0;}
    @media(max-width:380px){
      .row2{gap:8px !important;}
      .field input{font-size:16px !important;height:39px !important;padding:0 9px !important;}
      .modal h2{font-size:18px !important;}
      .order{grid-template-columns:40px minmax(0,1fr) auto 32px 32px;gap:5px;}
    }



    /* v16 time picker */
    .timePick{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;min-width:0;}
    .timePick select{width:100%;height:40px;border-radius:13px;border:1.7px solid var(--line2);background:var(--input);color:var(--text);font-size:16px;font-weight:760;padding:0 10px;outline:none;appearance:auto;-webkit-appearance:menulist;box-sizing:border-box;}
    .timePick select option{background:#071c22;color:#fff;}
    body.light .timePick select option{background:#fff;color:#111;}
    .timeHint{font-size:11px;color:var(--muted);font-weight:700;margin-top:-2px;}
    @media(max-width:380px){.timePick{gap:7px}.timePick select{height:39px;font-size:16px;padding:0 8px;}}

  
    /* v17: light theme closed days and action button outlines */
    body.light .day.closed{background:linear-gradient(145deg,#42d884,#158a51) !important;color:#062019 !important;border-color:#1f9b61 !important;box-shadow:0 0 0 2px rgba(31,155,97,.16) !important;}
    body.light .day.closed.sat{color:#062019 !important;}
    body.light .day.event{background:rgba(242,194,48,.22) !important;color:#8a6500 !important;border-color:#d9aa12 !important;}
    .mini{border:1.5px solid rgba(255,255,255,.38) !important;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18),0 8px 18px rgba(0,0,0,.16);}
    body.light .mini{border:1.5px solid rgba(0,0,0,.16) !important;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.28),0 8px 18px rgba(0,0,0,.10);}
    .edit{border-color:rgba(118,255,181,.45) !important;}
    .del{border-color:rgba(255,175,175,.50) !important;}
  
</style>

<body>
  <div class="app">
    <header><h1>Календарь перевозок</h1><button class="iconBtn themeBtn" id="themeBtn">☾</button><button class="iconBtn todayBtn" id="todayBtn" aria-label="Сегодня"><svg viewBox="0 0 24 24"><path d="M7 3v3M17 3v3M4.5 9h15M6 5h12a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/><path d="M12 13.2a2.2 2.2 0 1 0 0 4.4 2.2 2.2 0 0 0 0-4.4z"/></svg></button><button class="iconBtn shareBtn" id="shareBtn">↗</button></header>
    <section class="calendarCard" id="swipeArea"><div class="monthTop"><button class="navBtn" id="prev">‹</button><div class="monthTitle" id="monthTitle"></div><button class="navBtn" id="next">›</button></div><div class="week" id="week"></div><div class="grid" id="grid"></div></section>
    <div class="summary"><span id="selectedLabel"></span><span class="sum" id="dayTotal"></span></div>
    <div class="quickActions"><button class="pillAdd workAdd" id="addWork"><span class="plus">+</span> Работа</button><button class="pillAdd eventAdd" id="addEvent"><span class="plus">+</span> Событие</button></div>
    <div class="orders" id="orders"></div>
  </div>
  <div class="sheet" id="sheet"><div class="modal"><div class="modalHead"><h2 id="modalTitle">Добавить</h2><button class="close" id="close">×</button></div><form class="form" id="form"><div id="formFields" class="fields"></div><button class="save" type="submit">Сохранить</button></form></div></div>
  <datalist id="cities"></datalist>
<script>
const VERSION='v17-light-closed-actions';
const months=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const week=['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'];
const cities=['Хайфа','Тель-Авив','Иерусалим','Беэр-Шева','Акко','Тверия','Нагария','Кирьят-Ата','Кирьят-Бялик','Кирьят-Моцкин','Кирьят-Ям','Нешер','Тират-Кармель','Афула','Ноф-ха-Галиль','Назарет','Кармиэль','Цфат','Рош-Пина','Кацрин','Хадера','Нетания','Герцлия','Рамат-Ган','Гиватаим','Бат-Ям','Холон','Ришон-ле-Цион','Реховот','Нес-Циона','Ашдод','Ашкелон','Кирьят-Гат','Сдерот','Эйлат','Петах-Тиква','Кфар-Саба','Раанана','Ход-ха-Шарон','Рамат-ха-Шарон','Модиин','Лод','Рамла','Йокнеам','Зихрон-Яаков','Пардес-Хана','Ор-Акива','Кейсария','Маалот-Таршиха','Шломи','Кирьят-Шмона','Метулла','Далият-эль-Кармель','Осфия','Сахнин','Шфарам','Тамра','Умм-эль-Фахм','Арад','Димона','Нетивот','Офаким','Мицпе-Рамон','Явне','Ган-Явне','Кфар-Йона','Биньямина','Гиват-Ада','Кибуц Ягур','Кибуц Лохамей-ха-Гетаот','Кибуц Эйн-Гев','Кибуц Дгания','Кибуц Мааган-Михаэль','Кибуц Нахшолим','Кибуц Бейт-Альфа'];
cities.forEach(c=>{let o=document.createElement('option');o.value=c;document.getElementById('cities').appendChild(o)});
let today=new Date();let view=new Date(today.getFullYear(),today.getMonth(),1);let selected=new Date(today.getFullYear(),today.getMonth(),today.getDate());let editId=null;let formType='work';
const $=id=>document.getElementById(id);const key='cargoDiaryOrdersV10';
let orders=JSON.parse(localStorage.getItem(key)||localStorage.getItem('cargoDiaryOrdersV6')||'[]').map(o=>({type:'work',...o}));
function save(){localStorage.setItem(key,JSON.stringify(orders))}function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function money(n){return '₪'+Number(n||0).toLocaleString('ru-RU')}function dayName(d){return ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'][d.getDay()]}function esc(s){return String(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function render(){renderWeek();renderCal();renderOrders();$('themeBtn').textContent=document.body.classList.contains('light')?'☀':'☾'}
function renderWeek(){ $('week').innerHTML=week.map((w,i)=>`<div class="${i==6?'sat':''}">${w}</div>`).join('') }
function renderCal(){ $('monthTitle').textContent=months[view.getMonth()]+' '+view.getFullYear(); const grid=$('grid'); grid.innerHTML=''; let first=new Date(view.getFullYear(),view.getMonth(),1).getDay(); let days=new Date(view.getFullYear(),view.getMonth()+1,0).getDate(); for(let i=0;i<first;i++){let e=document.createElement('button');e.className='day empty';grid.appendChild(e)} for(let d=1;d<=days;d++){let date=new Date(view.getFullYear(),view.getMonth(),d);let k=ymd(date);let dayItems=orders.filter(o=>o.date===k);let hasWork=dayItems.some(o=>o.type!=='event');let hasEvent=dayItems.some(o=>o.type==='event');let el=document.createElement('button');el.className='day'+(date.getDay()==6?' sat':'')+(ymd(date)===ymd(selected)?' selected':'')+(hasWork?' closed':(!hasWork&&hasEvent?' event':''))+(ymd(date)===ymd(today)?' today':'');el.textContent=d;el.onclick=()=>{selected=date;render()};grid.appendChild(el)}}
function renderOrders(){let k=ymd(selected);let list=orders.filter(o=>o.date===k).sort((a,b)=>(a.time||'').localeCompare(b.time||''));$('selectedLabel').textContent=selected.getDate()+' '+months[selected.getMonth()].toLowerCase()+' • '+dayName(selected);let total=list.filter(o=>o.type!=='event').reduce((s,o)=>s+Number(o.price||0),0);$('dayTotal').textContent=total?money(total):''; if(!list.length){$('orders').innerHTML='';return} $('orders').innerHTML=list.map(o=>{let isEvent=o.type==='event';let title=isEvent?esc(o.place||o.to||'Событие'):`${esc(o.from)} → ${esc(o.to)}`;let price=isEvent?'<span class="eventTag">Событие</span>':`<div class="price">${money(o.price)}</div>`;return `<div class="order"><div class="time">${normalizeTime(o.time)||'--:--'}</div><div class="route">${title}</div>${price}<button class="mini edit" aria-label="Изменить" onclick="editOrder('${o.id}')"><svg viewBox="0 0 24 24"><path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M14 7l3 3"/></svg></button><button class="mini del" aria-label="Удалить" onclick="delOrder('${o.id}')"><svg viewBox="0 0 24 24"><path d="M6 7h12"/><path d="M9 7V5h6v2"/><path d="M8 10v9h8v-9"/><path d="M10 12v5M14 12v5"/></svg></button></div>`}).join('')}
function changeMonth(n){const grid=$('grid');grid.classList.add(n>0?'slideL':'slideR');setTimeout(()=>{view=new Date(view.getFullYear(),view.getMonth()+n,1);selected=new Date(view.getFullYear(),view.getMonth(),1);grid.classList.remove('slideL','slideR');render()},180)}
$('prev').onclick=()=>changeMonth(-1);$('next').onclick=()=>changeMonth(1);$('todayBtn').onclick=()=>{today=new Date();view=new Date(today.getFullYear(),today.getMonth(),1);selected=new Date(today.getFullYear(),today.getMonth(),today.getDate());render()};
$('addWork').onclick=()=>openForm('work');$('addEvent').onclick=()=>openForm('event');$('close').onclick=()=>closeForm();$('sheet').onclick=e=>{if(e.target.id==='sheet')closeForm()};
function timeOptions(selected=''){
  selected=normalizeTime(selected);
  let [hh,mm]=(selected||defaultTime()).split(':');
  let hours=''; for(let i=0;i<24;i++){let v=String(i).padStart(2,'0');hours+=`<option value="${v}" ${v===hh?'selected':''}>${v}</option>`}
  let mins=['00','15','30','45'].map(v=>`<option value="${v}" ${v===mm?'selected':''}>${v}</option>`).join('');
  return `<div class="timePick"><select id="timeHour" aria-label="Часы">${hours}</select><select id="timeMinute" aria-label="Минуты">${mins}</select></div>`;
}
function defaultTime(){let d=new Date();let h=String(d.getHours()).padStart(2,'0');let m=d.getMinutes();let q=['00','15','30','45'].reduce((best,x)=>Math.abs(Number(x)-m)<Math.abs(Number(best)-m)?x:best,'00');return h+':'+q}
function normalizeTime(v){v=String(v||'').trim(); if(!v)return ''; let m=v.match(/^(\d{1,2})[:. ]?(\d{2})$/); if(!m)return v; let h=Math.max(0,Math.min(23,Number(m[1]))); let min=Number(m[2]); let allowed=[0,15,30,45]; min=allowed.reduce((b,x)=>Math.abs(x-min)<Math.abs(b-min)?x:b,0); return String(h).padStart(2,'0')+':'+String(min).padStart(2,'0')}
function getPickedTime(){let h=$('timeHour')?.value||'00';let m=$('timeMinute')?.value||'00';return h+':'+m}
function fieldsHTML(type,o={}){if(type==='event')return `<div class="field wide"><label>Куда</label><input id="place" list="cities" placeholder="Куда идёшь" value="${esc(o.place||o.to||'')}"></div><div class="field wide"><label>Время</label>${timeOptions(o.time)}</div>`;return `<div class="row2"><div class="field"><label>Откуда</label><input id="from" list="cities" placeholder="Хайфа" value="${esc(o.from||'')}"></div><div class="field"><label>Куда</label><input id="to" list="cities" placeholder="Тель-Авив" value="${esc(o.to||'')}"></div></div><div class="row2"><div class="field"><label>Время</label>${timeOptions(o.time)}</div><div class="field"><label>Цена ₪</label><input id="price" type="number" inputmode="numeric" placeholder="900" value="${esc(o.price||'')}"></div></div>`}
function openForm(type='work',o=null){formType=o?.type||type;editId=o?.id||null;$('modalTitle').textContent=editId?(formType==='event'?'Изменить событие':'Изменить работу'):(formType==='event'?'Добавить событие':'Добавить работу');$('formFields').innerHTML=fieldsHTML(formType,o||{});$('sheet').classList.add('show');setTimeout(()=>$('timeHour')?.focus(),100)}function closeForm(){$('sheet').classList.remove('show')}
$('form').onsubmit=e=>{e.preventDefault();let obj;if(formType==='event'){obj={id:editId||String(Date.now()),type:'event',date:ymd(selected),time:getPickedTime(),place:$('place').value.trim()}; if(!obj.place&&!obj.time)return}else{obj={id:editId||String(Date.now()),type:'work',date:ymd(selected),time:getPickedTime(),from:$('from').value.trim(),to:$('to').value.trim(),price:$('price').value}; if(!obj.from&&!obj.to&&!obj.price)return} if(editId){orders=orders.map(o=>o.id===editId?obj:o)}else orders.push(obj);save();closeForm();render()};
window.editOrder=id=>openForm('work',orders.find(o=>o.id===id));window.delOrder=id=>{if(confirm('Удалить?')){orders=orders.filter(o=>o.id!==id);save();render()}};
$('themeBtn').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem('cargoTheme',document.body.classList.contains('light')?'light':'dark');render()}; if(localStorage.getItem('cargoTheme')==='light')document.body.classList.add('light');
$('shareBtn').onclick=async()=>{let url=location.origin+location.pathname; if(navigator.share){try{await navigator.share({title:'Календарь перевозок',text:'Календарь перевозок',url})}catch(e){}}else{prompt('Ссылка:',url)}};
let sx=0,sy=0;$('swipeArea').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});$('swipeArea').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4)changeMonth(dx<0?1:-1)},{passive:true});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js?v=18').catch(()=>{})}render();
</script>
</body></html>
